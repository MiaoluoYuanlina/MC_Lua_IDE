if (project.hasProperty("imGuiAxiomJar")) {
	tasks.register("prepareImGuiAxiomFixture", Copy) {
		from(project.property("imGuiAxiomJar").toString())
		into(layout.buildDirectory.dir("imgui-axiom-probe/mods"))
		rename { "axiom-compat-fixture.jar" }
	}
	tasks.named("runClient") { dependsOn "prepareImGuiAxiomFixture" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional client integration: not bundled into the server or required by players.
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Embedded Lua 5.2-compatible runtime used by the authoritative server-side runner.
	implementation include("org.luaj:luaj-jse:3.0.1")
	// Windows Ink pen pressure for the client PNG editor; other platforms keep mouse behavior.
	clientImplementation include("net.java.dev.jna:jna:5.17.0")
	// Independent, client-only editor UI. Use Minecraft's LWJGL, never bundle another copy.
	clientImplementation include("io.github.spair:imgui-java-binding:1.92.7.1")
	clientImplementation(include("io.github.spair:imgui-java-lwjgl3:1.92.7.1")) { transitive = false }
	['windows', 'linux', 'macos'].each { platform ->
		clientRuntimeOnly include("io.github.spair:imgui-java-natives-${platform}:1.92.7.1")
	}
}

// Keep Axiom's shaded libraries out of the launcher/system classpath, just like a real mod pack.
if (project.hasProperty("blockBreakAxiomJar")) {
	tasks.register("prepareBlockBreakAxiomFixture", Copy) {
		from(project.property("blockBreakAxiomJar").toString())
		into(layout.buildDirectory.dir("axiom-block-break-probe/mods"))
		rename { "axiom-compat-fixture.jar" }
	}
	tasks.named("runClient") { dependsOn "prepareBlockBreakAxiomFixture" }
}

processResources {
	// The in-game manual is edited under docs/ (one place for all documentation) and packaged where the IDE loads it from.
	from("docs/manual") { into "assets/mc_lua_ide/manual" }
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// Self-test probes and smoke tests live in the client source set for convenience (they need the game classpath);
	// they are run from the build directories and must not ship to players.
	exclude '**/*Probe.class', '**/*Probe$*.class', '**/*Smoke.class', '**/*Smoke$*.class'
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.register("componentCodecSmoke", JavaExec) {
	dependsOn testClasses
	group = "verification"
	description = "Round-trips Lua item data components through Minecraft's runtime codecs."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "wiki.ica.xiaomiao.mcluaide.server.LuaItemStackCodecSmoke"
}

check.dependsOn componentCodecSmoke
