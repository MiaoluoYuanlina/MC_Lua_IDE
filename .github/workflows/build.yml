name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows is the tested platform; its result decides whether a release is published.
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run smoke tests
        shell: bash
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mc_lua_ide-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  linux:
    # Runs the same smoke tests on Linux, which also exercises the untested Linux terminal path.
    # Reported, but not yet required for a release.
    name: Build and test (Linux, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run smoke tests
        run: ./gradlew build --stacktrace

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches mod_version
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties" >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md section for $version" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: mc_lua_ide-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.jar
          fail_on_unmatched_files: true
